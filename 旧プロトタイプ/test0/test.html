<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCANA SIEGE: LOGIC & STRATEGY</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14;--bg2:#141720;--bg3:#1c2030;
  --gold:#c9a84c;--gold2:#f0d080;
  --red:#c04040;--red2:#e05050;
  --blue:#3a6ea8;--blue2:#5090d0;
  --teal:#2a8070;--teal2:#40b090;
  --purple:#6a3a9a;--purple2:#9060c0;
  --text:#d8dce8;--text2:#9098b0;
  --border:rgba(100,110,140,0.25);--border2:rgba(180,190,220,0.15);
  --font-hd:'Cinzel',serif;--font-bd:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-bd);overflow:hidden;user-select:none;font-size:14px;}
h1,h2,h3{font-family:var(--font-hd);letter-spacing:0.1em;text-transform:uppercase;}

#app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative;}
.screen{flex:1;display:none;flex-direction:column;background:radial-gradient(circle at center, var(--bg2) 0%, var(--bg) 100%); overflow: visible !important;}
.screen.active{display:flex;}

/* HUD */
#global-hud{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:rgba(0,0,0,0.8);border-bottom:1px solid var(--border);z-index:9999;}
.stat-group{display:flex;gap:15px;}
.stat-item{font-weight:bold;font-size:0.85rem;}
.stat-val{color:var(--gold);font-family:var(--font-hd);margin-left:4px;}

/* Battle Field */
#battle-arena{flex:1;display:flex;flex-direction:column;justify-content:center;gap:15px;padding:10px 0;position:relative; overflow: visible !important;}
.lane{display:flex;justify-content:center;gap:10px;min-height:130px; overflow: visible !important;}
.slot{width:95px;height:130px;border:1px dashed var(--border);border-radius:6px;position:relative;background:rgba(255,255,255,0.02); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: visible !important;}

/* Movement Nodes */
.node-btn{width:50px; height:50px; background:var(--bg3); border:2px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.5rem; transition:0.2s; box-shadow:0 0 10px rgba(0,0,0,0.5); z-index: 100;}
.node-btn:hover{background:var(--gold); color:var(--bg); transform:scale(1.1);}

/* Tooltip System */
.tooltip-container { position: relative; overflow: visible !important; cursor: pointer; }
.tooltip-container:hover { z-index: 100001; }
.tooltip-box {
    visibility: hidden; opacity: 0;
    position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
    width: 200px; background: rgba(0, 0, 0, 1); color: #fff;
    padding: 12px; border-radius: 4px; border: 2px solid var(--gold);
    font-size: 0.8rem; line-height: 1.4; text-align: center;
    pointer-events: none; z-index: 100000; transition: opacity 0.2s;
    box-shadow: 0 5px 30px rgba(0,0,0,1);
}
.reward-top .tooltip-box { bottom: auto; top: 110%; }
.tooltip-container:hover .tooltip-box { visibility: visible; opacity: 1; }

/* Cards */
.card{width:90px;height:125px;background:var(--bg3);border:2px solid var(--gold);border-radius:6px;position:relative;display:flex;flex-direction:column; overflow: visible !important; transition: transform 0.2s;}
.card.enemy{border-color:var(--red);}
.card.enemy.selectable{cursor:pointer; border-color:var(--blue); animation: pulse-blue 1s infinite; z-index: 500;}
@keyframes pulse-blue { 0% {box-shadow: 0 0 0 0 var(--blue);} 100% {box-shadow: 0 0 0 10px transparent;} }

.card.spell{border-color:var(--blue); cursor: pointer;}
.card.spell.used{opacity: 0.4; filter: grayscale(1); cursor: default;}
.card-header{font-size:0.6rem;padding:2px;background:rgba(0,0,0,0.4);text-align:center;}
.card-body{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.card-footer{display:flex;justify-content:space-between;padding:2px 5px;background:rgba(0,0,0,0.4);font-weight:bold;font-size:0.75rem;}
.hp-bar{position:absolute;bottom:0;left:0;height:4px;background:var(--teal);width:100%;transition:width 0.3s;}
.charge-badge{position:absolute; bottom: -5px; right: -5px; background: var(--blue); color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: bold; border: 1.5px solid white; z-index: 100;}

/* Player Area */
#player-area{height:180px;background:var(--bg2);border-top:2px solid var(--gold);display:flex;padding:10px;gap:15px;justify-content:center;align-items:center; z-index: 10; overflow: visible !important;}
.hand-section{display:flex;flex-direction:column;gap:5px;align-items:center; overflow: visible !important;}
.slot-row{display:flex;gap:5px; overflow: visible !important;}

/* Reward Area */
.content-area{flex:1;padding:20px;max-width:1000px;margin:0 auto;width:100%; overflow: visible !important;}
.grid-reward{display:grid;grid-template-columns:repeat(3, 1fr); gap:15px; margin-bottom:25px; overflow: visible !important;}
.shop-item{background:var(--bg3); border:1px solid var(--border); padding:15px; border-radius:8px; text-align:center; cursor:pointer; transition:0.2s; position:relative; overflow: visible !important;}
.shop-item:hover:not(.taken){border-color:var(--gold); transform:translateY(-3px);}
.shop-item.taken{opacity:0.2; cursor: default;}
.shop-item.selecting{border: 2px solid var(--teal2); animation: pulse-teal 1s infinite;}
@keyframes pulse-teal { 0% {box-shadow: 0 0 0 0 var(--teal);} 100% {box-shadow: 0 0 0 10px transparent;} }
.price-tag{font-size:0.8rem; color:var(--gold2); font-weight:bold; margin-top:10px;}

#log{position:absolute;right:20px;top:60px;width:220px;max-height:150px;overflow:hidden;pointer-events:none;display:flex;flex-direction:column-reverse;gap:4px;z-index:50;}
.log-entry{background:rgba(0,0,0,0.6);padding:3px 8px;border-left:2px solid var(--gold);font-size:0.7rem;}

.btn{padding:8px 20px;background:var(--gold);color:var(--bg);border:none;border-radius:4px;cursor:pointer;font-family:var(--font-hd);font-weight:bold;transition:0.2s;}
.btn:hover:not(:disabled){background:var(--gold2);transform:scale(1.05);}
.btn:disabled{background:#444;color:#888;cursor:not-allowed;}
</style>
</head>
<body>

<div id="app">
  <div id="global-hud">
    <h2 id="stage-title">STAGE 1</h2>
    <div class="stat-group">
      <div class="stat-item">LIFE <span id="stat-life" class="stat-val">20</span></div>
      <div class="stat-item">SOUL <span id="stat-soul" class="stat-val">0</span></div>
      <div class="stat-item">GRADE <span id="stat-grade" class="stat-val">1</span></div>
      <div class="stat-item">RETRY <span id="stat-retry" class="stat-val">0/3</span></div>
    </div>
  </div>

  <div id="scr-battle" class="screen active">
    <div id="battle-arena">
      <div id="enemy-lane" class="lane"></div>
      <div id="ally-lane" class="lane"></div>
    </div>
    <div id="log"></div>
    <div id="player-area">
      <div class="hand-section">
        <div id="ring-slots" class="slot-row"></div>
      </div>
      <div class="hand-section">
        <div id="spell-slots" class="slot-row"></div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-left:15px;">
        <button id="btn-end-turn" class="btn" onclick="processEnemyTurn()">TURN END</button>
        <button id="btn-surrender" class="btn" style="background:var(--red); font-size:0.6rem; padding:4px;" onclick="surrender()">降参</button>
      </div>
    </div>
  </div>

  <div id="scr-shop" class="screen">
    <div class="content-area">
      <h2 style="color:var(--gold); margin-bottom:10px;" id="shop-msg">報酬選択</h2>
      <div id="shop-items" class="grid-reward"></div>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <button id="btn-gradeup" class="btn" onclick="upgradeGrade()">GRADE UP (COST: <span id="grade-cost">5</span>)</button>
        <button id="btn-next" class="btn" style="background:var(--teal);" onclick="startNextBattle()">次の戦闘へ</button>
      </div>
      <div style="margin-bottom:10px; font-weight:bold; color:var(--purple2);">EQUIPMENT (DISCARD = +1 SOUL)</div>
      <div id="inv-grid" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>
  </div>
</div>

<script>
// --- Data ---
const RINGS_DATA = {
  wolf:   { name: "狼の指輪", emoji: "🐺", atk: 3, hp: 3, cost: 3, trigger: "battle_start", desc: "開始時に3/3の狼を召喚する。" },
  rot:    { name: "腐臭の指輪", emoji: "🧟", atk: 1, hp: 2, cost: 3, trigger: "turn_start", desc: "ターン開始時に1/2のハイエナを召喚。" },
  wisp:   { name: "鬼火の指輪", emoji: "🔥", atk: 4, hp: 1, cost: 3, trigger: "on_summon", desc: "仲間が召喚される度、4/1の鬼火を召喚（自ターンのみ）。" },
  statue: { name: "石像の指輪", emoji: "🗿", atk: 4, hp: 5, cost: 3, trigger: "on_action", desc: "魔法を使う度、4/5の石像を召喚。" },
  dragon: { name: "竜の指輪", emoji: "🐉", atk: 15, hp: 20, cost: 3, trigger: "on_damage_taken", threshold: 12, desc: "累計12回被ダメで15/20の竜を召喚。" },
  shadow: { name: "影の指輪", emoji: "👥", atk: 2, hp: 2, cost: 3, trigger: "on_ally_death", threshold: 10, desc: "味方10体死亡でランダムな敵を召喚。" },
  skel:   { name: "骸骨の指輪", emoji: "💀", atk: 1, hp: 1, cost: 3, trigger: "on_ally_death", desc: "骸骨以外の仲間が死亡する度、1/1の骸骨を召喚。" }
};

const SPELLS_DATA = {
  strike: { name: "炎の杖", emoji: "🪄", atk: 2, cost: 2, desc: "対象の敵に 2 ダメージを与える。" },
  heal:   { name: "治癒の杖", emoji: "✨", hp: 10, cost: 2, desc: "味方の先頭を 10 回復する。" },
  bomb:   { name: "爆薬の瓶", emoji: "🧪", atk: 3, cost: 1, desc: "敵全員に 3 ダメージを与える。" },
  acid:   { name: "酸の瓶", emoji: "🏺", atk: 6, cost: 1, desc: "敵の先頭に 6 ダメージを与える。" }
};

const ENCHANTS = {
  power: { name: "攻撃強化", emoji: "⚔️", cost: 3, desc: "召喚物に ATK+3 を追加。" },
  life: { name: "生命強化", emoji: "💖", cost: 3, desc: "召喚物に HP+3 を追加。" },
  death_blast: { name: "不浄の爆竹", emoji: "🎆", cost: 3, desc: "死亡時、敵全員に 5 ダメージ。" }
};

// --- State ---
let G = {
  stage: 1, life: 20, soul: 0, grade: 1, retry: 0,
  rings: [ {id: 'wolf', atk: 3, hp: 3, count: 0, enchants: []} ],
  spells: [ {id: 'strike', atk: 2, charges: 5, used: false} ],
  allies: [], enemies: [], nodes: Array(6).fill(null),
  isBattle: false, actionUsed: false, currentRewards: [],
  selectingEnchant: null, castingSpellIdx: null, isEnemyPhase: false
};

function init() {
  updateHUD();
  startBattle();
}

function updateHUD() {
  document.getElementById('stat-life').innerText = G.life;
  document.getElementById('stat-soul').innerText = G.soul;
  document.getElementById('stat-grade').innerText = G.grade;
  document.getElementById('stat-retry').innerText = `${G.retry}/3`;
  document.getElementById('stage-title').innerText = `STAGE ${G.stage}`;
  if(document.getElementById('grade-cost')) document.getElementById('grade-cost').innerText = G.grade * 5;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('scr-' + id).classList.add('active');
}

function startBattle() {
  G.isBattle = true; G.allies = []; G.enemies = []; G.actionUsed = false; G.isEnemyPhase = false;
  G.castingSpellIdx = null; G.nodes = Array(6).fill(null);
  G.spells.forEach(s => s.used = false);
  document.getElementById("btn-end-turn").disabled = false;
  generateEnemies();
  processTriggers("battle_start");
  renderBattle();
}

function generateEnemies() {
  const hpPool = [6,12,20,35,70,80,100,140,250,500,600,800,1000,1500,2500,3000,4000,5000,7000,12000];
  const total = hpPool[G.stage-1] || (G.stage * G.stage * 15);
  const count = Math.max(2, Math.min(6, 1 + Math.floor(G.stage / 3)));
  for(let i=0; i<count; i++) {
    const hp = Math.ceil(total / count);
    G.enemies.push({ id:Math.random(), name:"敵", emoji:"👹", atk:Math.ceil(hp/3)+1, hp:hp, maxHp:hp, type:"enemy", slotIdx: i });
  }
}

// --- Triggers ---
function processTriggers(type, sourceUnit = null) {
  G.rings.forEach(ring => {
    const data = RINGS_DATA[ring.id];
    let fire = false;
    switch(data.trigger) {
      case "battle_start": if(type === "battle_start") fire = true; break;
      case "turn_start": if(type === "turn_start") fire = true; break;
      case "on_summon": 
        if(type === "on_summon" && ring.id === 'wisp' && G.isEnemyPhase) break; // 鬼火は敵フェイズに湧かない
        if(type === "on_summon") fire = true; 
        break;
      case "on_action": if(type === "on_action") fire = true; break;
      case "on_ally_death": 
        if(type === "on_ally_death") {
          if(ring.id === 'skel' && sourceUnit && sourceUnit.name === '骸骨') break; // 骸骨は骸骨の死に反応しない
          fire = true;
        }
        break;
      case "on_damage_taken": if(type === "damage_taken") ring.count++; break;
      case "on_full_board": if(G.allies.length >= 6) fire = true; break;
    }
    if(data.threshold && ring.count >= data.threshold) { fire = true; ring.count = 0; }
    if(fire) summon(ring);
  });
  renderBattle();
}

function summon(ring) {
  if(G.allies.length >= 6 && ring.id !== 'demon') return;
  const data = RINGS_DATA[ring.id];
  if(ring.id === 'demon' && G.allies.length >= 6) { G.allies = []; addLog("魔神降臨！"); }
  const count = data.count || 1;
  for(let i=0; i<count; i++) {
    if(G.allies.length >= 6) break;
    let u = {
      id: Math.random(), emoji: data.emoji, atk: ring.atk, hp: ring.hp,
      maxHp: ring.hp, type: "ally", enchants: [...ring.enchants], name: data.name.replace("の指輪", "")
    };
    u.enchants.forEach(eId => {
      const e = ENCHANTS[eId];
      if(eId === 'power') u.atk += 3;
      if(eId === 'life') { u.hp += 3; u.maxHp += 3; }
    });
    G.allies.push(u);
    if(ring.id !== 'wisp') processTriggers("on_summon");
  }
}

// --- Spells ---
function clickSpell(idx) {
  if(!G.isBattle || G.actionUsed || G.isEnemyPhase) return;
  const spell = G.spells[idx];
  const data = SPELLS_DATA[spell.id];
  if(data.name.includes("瓶") && data.atk === 3) {
    useSpellOn(idx, null);
  } else {
    G.castingSpellIdx = idx;
    addLog("対象を選択...");
    renderBattle();
  }
}

async function useSpellOn(spellIdx, targetId) {
  if(spellIdx === null) return;
  const spell = G.spells[spellIdx];
  const data = SPELLS_DATA[spell.id];
  const mult = Math.pow(4, G.grade - 1);
  const power = (data.atk || data.hp) * mult;

  if(data.name.includes("瓶") && data.atk === 3) {
    dealDamageToAllEnemies(power);
  } else if(targetId) {
    const unit = G.enemies.find(e => e.id === targetId) || G.allies.find(a => a.id === targetId);
    if(!unit) return;
    if(data.atk) await damageUnit(unit, power);
    else if(data.hp) unit.hp = Math.min(unit.maxHp, unit.hp + power);
  } else {
    return;
  }

  spell.charges--; spell.used = true; G.actionUsed = true; G.castingSpellIdx = null;
  if(spell.charges <= 0) G.spells.splice(spellIdx, 1);
  processTriggers("on_action");
  checkVictory();
}

async function processEnemyTurn() {
  G.isEnemyPhase = true;
  document.getElementById("btn-end-turn").disabled = true;
  await new Promise(r => setTimeout(r, 400));
  for(let enemy of [...G.enemies]) {
    if(G.enemies.length === 0) break;
    if(G.allies.length > 0) {
      const target = G.allies[0];
      const reflectDmg = target.atk;
      await damageUnit(target, enemy.atk);
      if(enemy.hp > 0) await damageUnit(enemy, reflectDmg);
    } else {
      G.life -= 1; if(G.life <= 0) return gameOver();
    }
    await new Promise(r => setTimeout(r, 150));
  }
  if(checkVictory()) return;
  G.isEnemyPhase = false;
  G.actionUsed = false; G.spells.forEach(s => s.used = false);
  processTriggers("turn_start");
  document.getElementById("btn-end-turn").disabled = false;
  renderBattle(); updateHUD();
}

async function damageUnit(unit, amt) {
  unit.hp -= amt;
  if(unit.type === 'ally') processTriggers("damage_taken");
  if(unit.hp <= 0) {
    if(unit.enchants && unit.enchants.includes('death_blast')) dealDamageToAllEnemies(5);
    if(unit.type === 'ally') { 
      const deadName = unit.name;
      G.allies = G.allies.filter(u => u.id !== unit.id); 
      processTriggers("on_ally_death", {name: deadName}); 
    } else { 
      spawnNodeAt(unit.slotIdx);
      G.enemies = G.enemies.filter(u => u.id !== unit.id); G.soul += 1; updateHUD();
    }
  }
  renderBattle();
}

function dealDamageToAllEnemies(dmg) {
  G.enemies.forEach(e => { e.hp -= dmg; if(e.hp <= 0) { G.soul += 1; spawnNodeAt(e.slotIdx); } });
  G.enemies = G.enemies.filter(e => e.hp > 0);
  updateHUD(); renderBattle(); checkVictory();
}

function spawnNodeAt(idx) {
  const hasShop = G.nodes.some(n => n && n.type === 'shop');
  const hasShrine = G.nodes.some(n => n && n.type === 'shrine');
  const rand = Math.random();
  if(!hasShop && rand < 0.25) G.nodes[idx] = {type: 'shop', icon: '⚖️'};
  else if(!hasShrine && rand < 0.35) G.nodes[idx] = {type: 'shrine', icon: '✨'};
  else G.nodes[idx] = {type: 'battle', icon: '⚔️'};
}

function checkVictory() {
  if(G.enemies.length === 0) {
    G.isBattle = false; G.isEnemyPhase = false;
    document.getElementById("btn-end-turn").disabled = true;
    addLog("道を選んでください。"); renderBattle(); return true;
  }
  return false;
}

// --- Navigation & Rewards ---
function handleNodeClick(nodeType) {
  if(nodeType === 'shrine') { G.life = Math.min(20, G.life + 5); addLog("癒やされた。"); }
  goToReward();
}

function goToReward() {
  G.isBattle = false; G.selectingEnchant = null; G.currentRewards = [];
  const mult = Math.pow(4, G.grade - 1);
  const poolR = Object.keys(RINGS_DATA);
  const poolW = ["strike", "heal"];
  const poolI = ["bomb", "acid"];
  const poolE = Object.keys(ENCHANTS);

  G.currentRewards.push({id: poolR[Math.floor(Math.random()*poolR.length)], taken: false, m: mult});
  G.currentRewards.push({id: poolW[Math.floor(Math.random()*poolW.length)], taken: false, m: mult});
  G.currentRewards.push({id: poolI[Math.floor(Math.random()*poolI.length)], taken: false, m: mult});

  const fullPool = [...poolR, ...poolW, ...poolI, ...poolE];
  while(G.currentRewards.length < 6) {
    let rid = fullPool[Math.floor(Math.random()*fullPool.length)];
    if(!G.currentRewards.some(r => r.id === rid)) {
      G.currentRewards.push({id: rid, taken: false, m: mult});
    }
  }
  showScreen('shop'); renderRewardScreen();
}

function getRingDesc(ring) {
  const base = RINGS_DATA[ring.id];
  let desc = base.desc;
  if(ring.enchants.length > 0) {
    desc += "\n【付与】";
    ring.enchants.forEach(eId => desc += ENCHANTS[eId].name + " ");
  }
  return desc;
}

function renderRewardScreen() {
  const container = document.getElementById('shop-items'); container.innerHTML = "";
  const shopMsg = document.getElementById('shop-msg');
  shopMsg.innerText = G.selectingEnchant ? "付与する指輪を選択してください" : "報酬選択";

  G.currentRewards.forEach((rew, i) => {
    const item = document.createElement("div");
    item.className = `shop-item tooltip-container ${rew.taken ? 'taken' : ''} ${G.selectingEnchant && G.selectingEnchant.rewardIdx === i ? 'selecting' : ''} ${i < 3 ? 'reward-top' : ''}`;
    let data = RINGS_DATA[rew.id] || SPELLS_DATA[rew.id] || ENCHANTS[rew.id];
    item.innerHTML = `<h3>${data.emoji || '🔮'} ${data.name}</h3><div class="price-tag">${data.cost} SOUL</div><div class="tooltip-box">${data.desc}</div>`;
    item.onclick = () => { if(G.soul >= data.cost && !rew.taken && !G.selectingEnchant) { takeItem(i); } };
    container.appendChild(item);
  });
  renderInventory(); updateHUD();
}

function takeItem(idx) {
  const rew = G.currentRewards[idx];
  const mult = rew.m;
  const data = RINGS_DATA[rew.id] || SPELLS_DATA[rew.id] || ENCHANTS[rew.id];

  if(RINGS_DATA[rew.id]) {
    if(G.rings.length >= 5) return alert("枠満杯");
    G.rings.push({id: rew.id, atk: data.atk * mult, hp: data.hp * mult, count: 0, enchants: []});
    G.soul -= data.cost; rew.taken = true;
  } else if(SPELLS_DATA[rew.id]) {
    if(G.spells.length >= 2) return alert("枠満杯");
    const charges = data.name.includes("杖") ? 5 : Math.floor(Math.random()*4)+3;
    G.spells.push({id: rew.id, atk: (data.atk||0)*mult, hp: (data.hp||0)*mult, charges: charges, used: false});
    G.soul -= data.cost; rew.taken = true;
  } else {
    if(G.rings.length === 0) return alert("指輪なし");
    G.selectingEnchant = { id: rew.id, rewardIdx: idx, cost: data.cost };
  }
  renderRewardScreen();
}

function applyEnchant(idx) {
  if(!G.selectingEnchant) return;
  G.rings[idx].enchants.push(G.selectingEnchant.id);
  G.soul -= G.selectingEnchant.cost;
  G.currentRewards[G.selectingEnchant.rewardIdx].taken = true;
  G.selectingEnchant = null; renderRewardScreen();
}

function discard(idx, type) {
  G[type + 's'].splice(idx, 1); G.soul += 1; updateHUD(); renderRewardScreen();
}

function upgradeGrade() {
  const cost = G.grade * 5; if(G.soul < cost) return;
  G.soul -= cost; G.grade++; updateHUD();
}

function startNextBattle() { G.stage++; G.soul += 3; showScreen('battle'); startBattle(); }
function surrender() { G.retry++; if(G.retry > 3) return gameOver(); goToReward(); }

function renderInventory() {
  const grid = document.getElementById("inv-grid"); grid.innerHTML = "";
  G.rings.forEach((r, i) => grid.appendChild(createInvCard(r, 'ring', i)));
  G.spells.forEach((s, i) => grid.appendChild(createInvCard(s, 'spell', i)));
}

function createInvCard(item, type, idx) {
  const div = document.createElement("div");
  div.className = "card tooltip-container"; div.style.width="75px"; div.style.height="105px";
  if(G.selectingEnchant && type === 'ring') div.classList.add('selecting');
  const data = type === 'ring' ? RINGS_DATA[item.id] : SPELLS_DATA[item.id];
  const desc = type === 'ring' ? getRingDesc(item) : data.desc;
  div.innerHTML = `<button style="position:absolute; top:-5px; right:-5px; background:var(--red); border:none; color:white; border-radius:50%; width:20px; height:20px; cursor:pointer; z-index:1001" onclick="event.stopPropagation(); discard(${idx}, '${type}')">×</button>
    <div class="card-body" style="font-size:1.2rem">${data.emoji}</div>
    <div class="tooltip-box">${desc}${type==='spell' ? `\n残り: ${item.charges}` : ""}</div>
    ${type==='spell' ? `<div class="charge-badge">${item.charges}</div>` : ""}`;
  if(G.selectingEnchant && type === 'ring') div.onclick = () => applyEnchant(idx);
  return div;
}

function renderBattle() {
  const el = document.getElementById("enemy-lane"); const al = document.getElementById("ally-lane");
  const rs = document.getElementById("ring-slots"); const ss = document.getElementById("spell-slots");
  el.innerHTML = ""; al.innerHTML = ""; rs.innerHTML = ""; ss.innerHTML = "";
  for(let i=0; i<6; i++) {
    el.appendChild(createEnemySlot(i));
    al.appendChild(createUnitSlot(G.allies[i]));
  }
  G.rings.forEach(r => rs.appendChild(createStaticCard(r, 'ring')));
  G.spells.forEach((s, i) => ss.appendChild(createStaticCard(s, 'spell', i)));
}

function createEnemySlot(idx) {
  const enemy = G.enemies.find(e => e.slotIdx === idx);
  const slot = document.createElement("div"); slot.className = "slot";
  if(enemy) {
    const pct = (enemy.hp / enemy.maxHp) * 100;
    const isTargetable = G.castingSpellIdx !== null;
    slot.innerHTML = `<div class="card tooltip-container enemy ${isTargetable ? 'selectable' : ''}" onclick="${isTargetable ? `useSpellOn(${G.castingSpellIdx}, '${enemy.id}')` : ''}">
      <div class="card-header">HP ${Math.ceil(enemy.hp)}</div>
      <div class="card-body">${enemy.emoji}</div>
      <div class="card-footer"><span>ATK ${enemy.atk}</span></div>
      <div class="hp-bar" style="width:${pct}%"></div>
      <div class="tooltip-box">敵: ${enemy.name}</div>
    </div>`;
  } else if(G.nodes[idx]) {
    const node = G.nodes[idx];
    const n = document.createElement("div"); n.className = "node-btn"; n.innerText = node.icon;
    n.onclick = () => handleNodeClick(node.type);
    slot.appendChild(n);
  }
  return slot;
}

function createUnitSlot(u) {
  const slot = document.createElement("div"); slot.className = "slot";
  if(u) {
    const pct = (u.hp / u.maxHp) * 100;
    const isTargetable = G.castingSpellIdx !== null && SPELLS_DATA[G.spells[G.castingSpellIdx].id].hp;
    slot.innerHTML = `<div class="card tooltip-container ${isTargetable ? 'selectable' : ''}" onclick="${isTargetable ? `useSpellOn(${G.castingSpellIdx}, '${u.id}')` : ''}">
      <div class="card-header">HP ${Math.ceil(u.hp)}</div>
      <div class="card-body">${u.emoji}</div>
      <div class="card-footer"><span>ATK ${u.atk}</span></div>
      <div class="hp-bar" style="width:${pct}%"></div>
      <div class="tooltip-box">${u.name}</div>
    </div>`;
  }
  return slot;
}

function createStaticCard(item, type, idx) {
  const isSpell = type === 'spell';
  const data = isSpell ? SPELLS_DATA[item.id] : RINGS_DATA[item.id];
  const usedClass = (isSpell && item.used) ? 'used' : '';
  const desc = isSpell ? data.desc : getRingDesc(item);
  const div = document.createElement("div");
  div.className = `card tooltip-container ${isSpell ? 'spell' : ''} ${usedClass}`;
  div.style.width = "55px"; div.style.height = "75px"; div.style.borderWidth = "1px";
  if(isSpell && !item.used) div.onclick = () => clickSpell(idx);
  div.innerHTML = `<div class="card-body" style="font-size:1.2rem">${data.emoji}</div>
                   <div class="tooltip-box">${desc}${isSpell ? `\nチャージ: ${item.charges}` : ""}</div>
                   ${isSpell ? `<div class="charge-badge">${item.charges}</div>` : ""}
                   ${!isSpell && item.count > 0 ? `<div style="position:absolute; top:2px; right:2px; background:var(--red); color:white; font-size:0.5rem; border-radius:50%; width:12px; height:12px; display:flex; align-items:center; justify-content:center;">${item.count}</div>` : ""}`;
  return div;
}

function addLog(m) {
  const l = document.getElementById("log"); const d = document.createElement("div");
  d.className = "log-entry"; d.innerText = m; l.prepend(d); if(l.children.length > 6) l.lastChild.remove();
}

function gameOver() { alert("Game Over"); location.reload(); }

init();
</script>
</body>
</html>
