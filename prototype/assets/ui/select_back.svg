<?xml version="1.0" encoding="UTF-8"?>
<!-- タイトルメニューの選択バー。
     旧版は「広いグローPNG＋長さの違う2本のライン」を重ねていたため、
     端に近づくほどアルファが 173→200→233→255 と段階的に増え、3段の縞に見えていた。
     すべてグラデーションで作り直し、端まで連続的に減衰するようにしている。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 101">
  <defs>
    <!-- 横方向の減衰。両端で完全に0まで落とす。 -->
    <linearGradient id="sbFadeWide" x1="0" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"     stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.055" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.12"  stop-color="#fff" stop-opacity="0.52"/>
      <stop offset="0.20"  stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="0.30"  stop-color="#fff" stop-opacity="0.97"/>
      <stop offset="0.42"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.58"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.70"  stop-color="#fff" stop-opacity="0.97"/>
      <stop offset="0.80"  stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="0.88"  stop-color="#fff" stop-opacity="0.52"/>
      <stop offset="0.945" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1"     stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- 芯のライン用。ハローより少し内側で消える。 -->
    <linearGradient id="sbFadeCore" x1="0" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"     stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.045" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.10"  stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.17"  stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="0.26"  stop-color="#fff" stop-opacity="0.96"/>
      <stop offset="0.36"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.64"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.74"  stop-color="#fff" stop-opacity="0.96"/>
      <stop offset="0.83"  stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="0.90"  stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.955" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1"     stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sbMaskWide" maskUnits="userSpaceOnUse" x="0" y="0" width="1090" height="101">
      <rect width="1090" height="101" fill="url(#sbFadeWide)"/>
    </mask>
    <mask id="sbMaskCore" maskUnits="userSpaceOnUse" x="0" y="0" width="1090" height="101">
      <rect width="1090" height="101" fill="url(#sbFadeCore)"/>
    </mask>
    <!-- 縦方向：中央へ向かって連続的に明るくなるハロー。 -->
    <linearGradient id="sbHalo" x1="0" y1="0" x2="0" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#8c5c2d" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#8c5c2d" stop-opacity="0.03"/>
      <stop offset="0.26" stop-color="#8c5c2d" stop-opacity="0.13"/>
      <stop offset="0.36" stop-color="#946237" stop-opacity="0.28"/>
      <stop offset="0.44" stop-color="#a5744a" stop-opacity="0.48"/>
      <stop offset="0.50" stop-color="#b3855c" stop-opacity="0.64"/>
      <stop offset="0.56" stop-color="#a5744a" stop-opacity="0.48"/>
      <stop offset="0.64" stop-color="#946237" stop-opacity="0.28"/>
      <stop offset="0.74" stop-color="#8c5c2d" stop-opacity="0.13"/>
      <stop offset="0.86" stop-color="#8c5c2d" stop-opacity="0.03"/>
      <stop offset="1"    stop-color="#8c5c2d" stop-opacity="0"/>
    </linearGradient>
    <!-- 芯のライン。上下とも数pxで滑らかに消す。 -->
    <linearGradient id="sbCore" x1="0" y1="46" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#956c44" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#956c44" stop-opacity="0.55"/>
      <stop offset="0.5"  stop-color="#956c44" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#956c44" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#956c44" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g mask="url(#sbMaskWide)">
    <rect width="1090" height="101" fill="url(#sbHalo)"/>
  </g>
  <g mask="url(#sbMaskCore)">
    <rect x="0" y="46" width="1090" height="10" fill="url(#sbCore)"/>
  </g>
</svg>
