<?xml version="1.0" encoding="UTF-8"?>
<!-- preserveAspectRatio="none" は必須。
     既定（xMidYMid meet）だと background-size:100% 100% を指定しても viewBox の比率
     1400:180 を保ったまま「幅に合わせて」縮小され、帯が縦にレターボックス化する。
     その結果、帯の実際の高さが要素の幅に比例してしまい、街（幅930px）と塔（幅717px）で
     高さが変わって見えていた。none で枠いっぱいに引き伸ばす。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 180" preserveAspectRatio="none">
  <defs>
    <!-- 背景: 左側は濃いまま、右端へ向かって透明化 -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#160b03" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#160b03" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#160b03" stop-opacity="0"/>
    </linearGradient>

    <!-- 枠線: 左側の金色を維持し、右へ向かって暗く・透明にフェード -->
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dca830" stop-opacity="1"/>
      <stop offset="50%" stop-color="#dca830" stop-opacity="1"/>
      <stop offset="68%" stop-color="#ce9d2b" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#a67c1f" stop-opacity="0.8"/>
      <stop offset="88%" stop-color="#876216" stop-opacity="0.55"/>
      <stop offset="96%" stop-color="#62440a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3f2800" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 帯の高さは180px（viewBox全体）。画面上の上辺Y=100pxは #village-name-plate の top で決める。 -->
  <rect x="0" y="0" width="1400" height="180" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1400" height="3" fill="url(#borderGradient)"/>
  <rect x="0" y="177" width="1400" height="3" fill="url(#borderGradient)"/>
</svg>
