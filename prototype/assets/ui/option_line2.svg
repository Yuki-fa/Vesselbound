<?xml version="1.0" encoding="UTF-8"?>
<!-- 先細りの図形（高さ2の菱形）で描くと、画面の縮小表示で輪郭が階段状にガタついた（2026-09-24 利用者指摘）。
     一定の太さの帯に、太さの変化と同じ具合の透明度を掛けて両端を消す。色は元の素材と同じ。
     書き出し直す時も、斜めの輪郭を持つ細い図形ではなく「帯＋透明度」にすること。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2" preserveAspectRatio="none">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#bf9000"/><stop offset="1" stop-color="#3f2800"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.125" stop-color="#fff" stop-opacity="0.49"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.77"/><stop offset="0.5" stop-color="#fff" stop-opacity="1"/><stop offset="0.75" stop-color="#fff" stop-opacity="0.77"/><stop offset="0.875" stop-color="#fff" stop-opacity="0.49"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="2"><rect width="1600" height="2" fill="url(#a)"/></mask>
  </defs>
  <!-- 元の素材と同じく全体を半透明（.5）にして、項目下の線は見出し下より暗く細く見せる。 -->
  <rect width="1600" height="2" fill="url(#c)" mask="url(#m)" opacity=".5"/>
</svg>
