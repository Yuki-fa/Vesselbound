<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFX · 4コマ撮影</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101412;color:#eee;font:14px sans-serif}header{height:66px;display:flex;align-items:center;gap:14px;padding:10px 14px}h1{font-size:18px;margin:0}button,select{color:#eee;background:#292b24;border:1px solid #897553;border-radius:3px;padding:8px}#status{font-size:12px;color:#d7be88}main{display:grid;grid-template-columns:repeat(2,var(--tile-width));gap:10px;justify-content:center}figure{margin:0;background:#1b201a;overflow:hidden}figcaption{height:28px;padding:6px 10px;color:#e6d2a8}.frame{position:relative;width:var(--tile-width);height:var(--tile-height);overflow:hidden}header a{color:#d7be88;font-size:11px;text-decoration:none}iframe{border:0;width:1600px;height:900px;transform-origin:top left;transform:scale(var(--scale));display:block}
</style>
<header><h1 id="title">準備中</h1><select id="effect"></select><button id="previous">前</button><button id="next">次</button><span id="status">画像を準備中</span><a href="review_capture.html?phases=1">始め・中盤・命中・終わり</a><a href="../vfx_preview.html?verify=1" target="_blank">file検査</a><a href="http://127.0.0.1:5500/tools/vfx_preview.html?verify=1" target="_blank">http検査</a></header>
<main id="frames"></main><pre id="checks" style="margin:12px 16px;font-size:11px;white-space:pre-wrap"></pre>
<script src="../../js/vfx/schema.js?v=vfx-layers1008-4"></script>
<script src="../../js/vfx/curves.js?v=vfx-layers1008-2"></script>
<script src="../../js/vfx/textures.js?v=vfx-layers1008-2"></script>
<script src="../../js/vfx/defs/geometry.js?v=vfx-layers1008-2"></script>
<script src="../../js/vfx/defs/effects.js?v=vfx-layers1008-5"></script>
<script src="../../js/vfx/renderer.js?v=vfx-layers1008-4"></script>
<script src="../../js/engine/fx_lab.js?v=vfx-layers1008-2"></script>
<script>
var VbFxReviewCapture=(function(){
 'use strict';var session={startEffect:'elemental',phases:false,checks:true};var phases=(new URLSearchParams(location.search).has('phases')?new URLSearchParams(location.search).get('phases')==='1':session.phases),times=phases?['begin','middle','impact','end']:[150,450,800,1200],names=VbFx.effects.map(function(d){return d.name;}),results={},current='',ready=false;
 var select=document.getElementById('effect');
 VbFx.effects.forEach(function(d,i){var o=document.createElement('option');o.value=d.name;o.textContent=String(i+1).padStart(2,'0')+' '+d.label;select.appendChild(o);});
 function scale(){var s=Math.min((innerWidth-26)/3200,(innerHeight-138)/1800);document.documentElement.style.setProperty('--scale',s);document.documentElement.style.setProperty('--tile-width',1600*s+'px');document.documentElement.style.setProperty('--tile-height',900*s+'px');}
 function show(name){
  ready=false;results={};current=name;select.value=name;document.title=name+(phases?'--phases':'')+' · VFX4コマ撮影';
  document.getElementById('title').textContent=VbFx.effects.find(function(d){return d.name===name;}).label;
  document.getElementById('status').textContent='4コマを描画中';var container=document.getElementById('frames');container.replaceChildren();
  times.forEach(function(ms){var f=document.createElement('figure'),label=document.createElement('figcaption'),wrap=document.createElement('div'),iframe=document.createElement('iframe');label.textContent=phases?({begin:'始め',middle:'中盤',impact:'命中',end:'終わり'}[ms]):ms+'ms';label.dataset.frame=ms;wrap.className='frame';iframe.src='../vfx_preview.html?photo='+encodeURIComponent(name)+(phases?'&phase=':'&ms=')+ms;iframe.title=ms+'ms';wrap.appendChild(iframe);f.append(label,wrap);container.appendChild(f);});
 }
 function move(delta){show(names[(names.indexOf(current)+delta+names.length)%names.length]);}
 select.onchange=function(){show(this.value);};document.getElementById('previous').onclick=function(){move(-1);};document.getElementById('next').onclick=function(){move(1);};
 window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='vb-fx-check'){var r=m.report;window.VbFxReviewChecks=window.VbFxReviewChecks||{};window.VbFxReviewChecks[r.protocol]=r;var summary={protocol:r.protocol,pass:r.pass,effects:r.effects.length,reverse:r.reverse.length,extras:r.extras.length,audioFiles:r.audioFiles,errors:r.errors,failure:r.failure||null};document.getElementById('checks').textContent+='VFX_QA_RESULT '+JSON.stringify(summary)+'\n';return;}if(!m||m.type!=='vb-fx-frame'||m.state.name!==current)return;var key=m.state.phase||m.state.requestedMs;results[key]=m.state;var caption=document.querySelector('[data-frame="'+key+'"]');if(caption&&phases)caption.textContent=({begin:'始め',middle:'中盤',impact:'命中',end:'終わり'}[key])+' · '+m.state.requestedMs+'ms';ready=times.every(function(t){return results[t]&&results[t].ready;});var errors=Object.values(results).filter(function(r){return r.error;});document.getElementById('status').textContent=errors.length?'FAIL '+errors.map(function(r){return r.error;}).join(' / '):ready?'READY · 4 / 4':'描画 '+Object.keys(results).length+' / 4';});
 window.addEventListener('keydown',function(e){var keys={'1':'dark-fire','2':'leprechaun','3':'shockwave','4':'worm','5':'demon-soul','7':'all-sweep','8':'all-ring','9':'all-cross','e':'elemental','d':'direwolf'};if(e.key==='0'){e.preventDefault();phases=false;times=[150,450,800,1200];show('dark-fire');}else if(e.key==='c'){e.preventDefault();show('cockatrice');}else if(e.key==='a'){e.preventDefault();show('atk-down');}else if(keys[e.key]){e.preventDefault();show(keys[e.key]);}else if(e.key==='6'){e.preventDefault();phases=true;times=['begin','middle','impact','end'];show('dark-fire');}else if(e.key==='ArrowRight'){e.preventDefault();move(1);}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});window.addEventListener('resize',scale);scale();show(session.startEffect||new URLSearchParams(location.search).get('name')||names[0]);if(session.checks){document.getElementById('checks').textContent='file/http 機能検査中（無音）\n';['../vfx_preview.html?verify=1','http://127.0.0.1:5500/tools/vfx_preview.html?verify=1'].forEach(function(url){var iframe=document.createElement('iframe');iframe.src=url;iframe.style.cssText='position:absolute;left:-5000px;top:0;width:1600px;height:900px;border:0;pointer-events:none;opacity:0';iframe.title='機能検査';document.body.appendChild(iframe);});}
 return {show:show,snapshot:function(){return {name:current,ready:ready,frames:results};}};
})();
</script></html>
